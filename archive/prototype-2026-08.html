function Calendar({day,setDay}) {
  const dows=['日','月','火','水','木','金','土'];
  const weeks=[]; let cell=-5;
  for(let w=0;w<6;w++){const days=[];for(let i=0;i<7;i++,cell++){days.push({n:cell,i});}weeks.push(days);}
  const ev = DAY_DATA[day] || [];
  return (
    <>
      <div style={{padding:'56px 18px 12px',background:'#fff',boxShadow:'0 1px 0 rgba(0,0,0,.06)'}}>
        <div className="row" style={{justifyContent:'space-between',height:40}}>
          <Icon n="chevron_left" s={22} c={GREY}/>
          <span style={{fontSize:15,fontWeight:700,color:'#22312e'}}>2026年8月</span>
          <Icon n="chevron_right" s={22} c={GREY}/>
        </div>
      </div>
      <div className="scroll" style={{flex:1,overflow:'auto',padding:'14px 14px 100px'}}>
        <Card style={{padding:'12px 10px'}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:6}}>
            {dows.map((d,i)=>(<div key={d} style={{textAlign:'center',fontSize:10.5,fontWeight:700,color:i===0?'#d1657a':i===6?'#5b9bd8':'#8a9491'}}>{d}</div>))}
          </div>
          {weeks.map((days,wi)=>(
            <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
              {days.map(({n,i})=>{
                if(n<1||n>31) return <div key={i} style={{height:46}}/>;
                const sel=n===day;
                return (
                  <div key={i} onClick={()=>setDay(n)} style={{height:46,display:'flex',flexDirection:'column',alignItems:'center',

        </>
      )}

      {cur==='my' && (
        <>
          <DBar title="マイページ" onBack={nav.length>1?back:null}/>
          {body(
            <div style={{display:'flex',flexDirection:'column',gap:14}}>
              <div style={{background:'#fff',borderRadius:14,border:'1px solid #e2e7e5',padding:16}}>
                <div style={{fontSize:19,fontWeight:700,color:'#1d2422'}}>YOKA 花子</div>
                <div style={{fontSize:15,color:'#5b6663',marginTop:6,lineHeight:1.6}}>安否登録済み<br/>避難所「大和小学校」</div>
              </div>
              <BigBtn bg="#fff" fg={GRN_D} bd={GRN} onClick={exitDisaster}>
                <Icon n="restart_alt" s={24} c={GRN_D}/>平常モードに戻す
              </BigBtn>
            </div>
          )}
        </>
      )}

      <TabBar cur={tabFor} set={onTab} accent={GRN} items={tabs}/>
    </>
  );
}
